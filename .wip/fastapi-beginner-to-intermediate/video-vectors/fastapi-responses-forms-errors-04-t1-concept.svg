<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="A 200 reply carries a body; a 204 reply carries none at all." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="40" width="400" height="110" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="92" text-anchor="middle" font-size="26" font-weight="700" fill="var(--green)">200</text>
    <text x="240" y="124" text-anchor="middle" font-size="16" fill="var(--tx-m)">a body follows</text>
  </g>
  <g class="na-draw" style="--d:1.2s">
    <path d="M240 152 L240 198" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#frfe04t1-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.7s">
    <rect x="40" y="200" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="240" y="255" text-anchor="middle" font-size="26" font-weight="700" fill="var(--orange)">204</text>
    <text x="240" y="288" text-anchor="middle" font-size="16" fill="var(--tx-m)">no body at all</text>
  </g>
  <defs>
    <marker id="frfe04t1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
