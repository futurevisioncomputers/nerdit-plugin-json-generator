<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="response_model filters EnquiryFull down to EnquiryOut's fields." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="40" width="400" height="110" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="240" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="var(--nb)">EnquiryFull</text>
    <text x="240" y="122" text-anchor="middle" font-size="16" fill="var(--tx-m)">every field, including internal_note</text>
  </g>
  <g class="na-draw" style="--d:1.2s">
    <path d="M240 152 L240 198" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#frfe04t2-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.7s">
    <rect x="40" y="200" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="255" text-anchor="middle" font-size="22" font-weight="700" fill="var(--green)">EnquiryOut</text>
    <text x="240" y="288" text-anchor="middle" font-size="16" fill="var(--tx-m)">only the public fields</text>
  </g>
  <defs>
    <marker id="frfe04t2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
