<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="Field() checks a value against a rule; a failed rule raises ValidationError with a plain message." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="40" width="400" height="110" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="240" y="90" text-anchor="middle" font-size="22" font-weight="700" fill="var(--nb)">Field() Rule</text>
    <text x="240" y="122" text-anchor="middle" font-size="16" fill="var(--tx-m)">checks a length or a number range</text>
  </g>
  <g class="na-draw" style="--d:1.2s">
    <path d="M240 152 L240 198" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#frbp03t3a-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.7s">
    <rect x="40" y="200" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--amber)" stroke-width="2"/>
    <text x="240" y="255" text-anchor="middle" font-size="22" font-weight="700" fill="var(--amber)">ValidationError</text>
    <text x="240" y="288" text-anchor="middle" font-size="16" fill="var(--tx-m)">a plain message naming what is wrong</text>
  </g>
  <defs>
    <marker id="frbp03t3a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
