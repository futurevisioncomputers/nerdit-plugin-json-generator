<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="pip installs the FastAPI app's library, the FastAPI app collects every route, and a route connects one URL to one function." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="20" width="400" height="90" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="240" y="75" text-anchor="middle" font-size="24" font-weight="700" fill="var(--nb)">pip install</text>
  </g>
  <g class="na-draw" style="--d:1s">
    <path d="M240 112 L240 148" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fgs01t2-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.5s">
    <rect x="40" y="150" width="400" height="90" rx="12" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="240" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="var(--orange)">FastAPI app</text>
  </g>
  <g class="na-draw" style="--d:2.4s">
    <path d="M240 242 L240 278" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fgs01t2-arrow)"/>
  </g>
  <g class="na-show" style="--d:2.9s">
    <rect x="40" y="280" width="400" height="60" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="var(--green)">route</text>
  </g>
  <defs>
    <marker id="fgs01t2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
