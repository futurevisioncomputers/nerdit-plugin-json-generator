<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="One shared dependency feeds the enquiries route and the learners route." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="140" y="20" width="200" height="80" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="240" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="var(--nb)">shared setup</text>
    <text x="240" y="86" text-anchor="middle" font-size="14" fill="var(--tx-m)">one paging function</text>
  </g>
  <g class="na-draw" style="--d:1.2s">
    <path d="M240 100 V130 H120 V160" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fdi05t2-arrow-a)"/>
  </g>
  <g class="na-draw" style="--d:1.2s">
    <path d="M240 100 V130 H360 V160" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fdi05t2-arrow-b)"/>
  </g>
  <g class="na-show" style="--d:1.8s">
    <rect x="20" y="162" width="200" height="80" rx="12" fill="var(--white)" stroke="var(--green)" stroke-width="2"/>
    <text x="120" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="var(--green)">enquiries route</text>
    <text x="120" y="226" text-anchor="middle" font-size="13" fill="var(--tx-m)">pages rows for Neha</text>
  </g>
  <g class="na-show" style="--d:2.3s">
    <rect x="260" y="162" width="200" height="80" rx="12" fill="var(--white)" stroke="var(--green)" stroke-width="2"/>
    <text x="360" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="var(--green)">learners route</text>
    <text x="360" y="226" text-anchor="middle" font-size="13" fill="var(--tx-m)">pages the same way</text>
  </g>
  <defs>
    <marker id="fdi05t2-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
    <marker id="fdi05t2-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
