<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="Many routes copy the same check; a dependency writes that check once." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="30" width="400" height="110" rx="12" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="240" y="82" text-anchor="middle" font-size="24" font-weight="700" fill="var(--orange)">many routes</text>
    <text x="240" y="114" text-anchor="middle" font-size="15" fill="var(--tx-m)">each one copies the same check</text>
  </g>
  <g class="na-draw" style="--d:1.3s">
    <path d="M240 142 L240 188" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fdi05t1-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.8s">
    <rect x="40" y="190" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="245" text-anchor="middle" font-size="24" font-weight="700" fill="var(--green)">one dependency</text>
    <text x="240" y="278" text-anchor="middle" font-size="15" fill="var(--tx-m)">written once, called by every route</text>
  </g>
  <defs>
    <marker id="fdi05t1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
