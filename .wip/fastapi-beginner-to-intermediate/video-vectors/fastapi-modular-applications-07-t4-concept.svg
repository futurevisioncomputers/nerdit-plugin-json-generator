<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="include_router copies enquiries_router and learners_router onto app, each with its own prefix." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="20" width="400" height="90" rx="12" fill="var(--white)" stroke="var(--bd)" stroke-width="2"/>
    <text x="240" y="60" text-anchor="middle" font-size="19" font-weight="700" fill="var(--tx)">two separate router files</text>
    <text x="240" y="90" text-anchor="middle" font-size="15" fill="var(--tx-m)">each on its own, with no app yet</text>
  </g>
  <g class="na-draw" style="--d:1.3s">
    <path d="M240 112 L240 158" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fma07t4-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.8s">
    <rect x="40" y="160" width="400" height="90" rx="12" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="240" y="200" text-anchor="middle" font-size="19" font-weight="700" fill="var(--orange)">one join, with its own prefix</text>
    <text x="240" y="230" text-anchor="middle" font-size="15" fill="var(--tx-m)">plus tags for the docs page</text>
  </g>
  <g class="na-draw" style="--d:3.1s">
    <path d="M240 252 L240 288" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fma07t4-arrow)"/>
  </g>
  <g class="na-show" style="--d:3.6s">
    <rect x="90" y="290" width="300" height="60" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="327" text-anchor="middle" font-size="19" font-weight="700" fill="var(--green)">app, one API</text>
  </g>
  <defs>
    <marker id="fma07t4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
