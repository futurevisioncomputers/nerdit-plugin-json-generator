<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="An empty __init__.py file marks the routers folder as one package Python can import." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="60" y="40" width="360" height="100" rx="12" fill="var(--white)" stroke="var(--bd)" stroke-width="2"/>
    <text x="240" y="82" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">one empty marker file</text>
    <text x="240" y="112" text-anchor="middle" font-size="15" fill="var(--tx-m)">inside the routers folder</text>
  </g>
  <g class="na-draw" style="--d:1.3s">
    <path d="M240 152 L240 198" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fma07t1b-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.8s">
    <rect x="40" y="200" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="var(--green)">python imports it as one package</text>
    <text x="240" y="280" text-anchor="middle" font-size="15" fill="var(--tx-m)">not a pile of loose scripts</text>
  </g>
  <defs>
    <marker id="fma07t1b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
