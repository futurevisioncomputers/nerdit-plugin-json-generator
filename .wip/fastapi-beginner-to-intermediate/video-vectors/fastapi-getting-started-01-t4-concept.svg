<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="requirements.txt lists every package pip freeze found, and .env holds settings and secrets outside your Python code." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="40" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="240" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="var(--nb)">requirements.txt</text>
    <text x="240" y="134" text-anchor="middle" font-size="16" fill="var(--tx-m)">pip freeze</text>
  </g>
  <g class="na-draw" style="--d:1.2s">
    <path d="M240 162 L240 198" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fgs01t4-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.7s">
    <rect x="40" y="200" width="400" height="120" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="260" text-anchor="middle" font-size="22" font-weight="700" fill="var(--green)">.env</text>
    <text x="240" y="294" text-anchor="middle" font-size="16" fill="var(--tx-m)">one app setting</text>
  </g>
  <defs>
    <marker id="fgs01t4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
