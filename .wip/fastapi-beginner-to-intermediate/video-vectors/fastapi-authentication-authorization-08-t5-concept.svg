<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="Testing checks both paths: a request with no token fails with 401, and the same request with a good token succeeds with 200." xmlns="http://www.w3.org/2000/svg">
  <g class="na-show" style="--d:0.2s">
    <text x="240" y="45" text-anchor="middle" font-size="20" fill="var(--tx)">Testing the flow</text>
  </g>
  <g class="na-show" style="--d:1.0s">
    <rect x="30" y="80" width="190" height="90" rx="14" fill="var(--white)" stroke="var(--bd)" stroke-width="1.5"/>
    <text x="125" y="115" text-anchor="middle" font-size="15" fill="var(--tx)">no token</text>
    <text x="125" y="150" text-anchor="middle" font-size="26" fill="var(--nb)">401</text>
  </g>
  <g class="na-show" style="--d:2.0s">
    <rect x="260" y="80" width="190" height="90" rx="14" fill="var(--white)" stroke="var(--green)" stroke-width="1.5"/>
    <text x="355" y="115" text-anchor="middle" font-size="15" fill="var(--tx)">Neha token</text>
    <text x="355" y="150" text-anchor="middle" font-size="26" fill="var(--green)">200</text>
  </g>
  <g class="na-show" style="--d:3.0s">
    <rect x="30" y="200" width="420" height="70" rx="14" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="240" y="240" text-anchor="middle" font-size="16" fill="var(--orange)">Expired token: ExpiredSignatureError</text>
  </g>
  <g class="na-pulse" style="--d:4.0s">
    <text x="60" y="320" font-size="15" fill="var(--tx-m)">a scope and an API key go further still</text>
  </g>
</svg>
