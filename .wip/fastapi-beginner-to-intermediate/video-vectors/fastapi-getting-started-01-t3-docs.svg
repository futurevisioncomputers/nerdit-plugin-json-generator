<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="The /docs page lists every route; clicking Try it out and Execute sends a real request and shows the real response." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="40" y="30" width="400" height="90" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="240" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="var(--nb)">/docs</text>
    <text x="240" y="100" text-anchor="middle" font-size="15" fill="var(--tx-m)">GET /</text>
  </g>
  <g class="na-draw" style="--d:1s">
    <path d="M240 122 L240 150" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fgs01t3b-arrow)"/>
  </g>
  <g class="na-show" style="--d:1.4s">
    <rect x="40" y="152" width="400" height="80" rx="12" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="240" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="var(--orange)">Try it out → Execute</text>
  </g>
  <g class="na-draw" style="--d:2.3s">
    <path d="M240 234 L240 262" stroke="var(--bd)" stroke-width="3" fill="none" marker-end="url(#fgs01t3b-arrow)"/>
  </g>
  <g class="na-show" style="--d:2.7s">
    <rect x="40" y="264" width="400" height="76" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="var(--green)">Future Vision Admissions API is running</text>
  </g>
  <defs>
    <marker id="fgs01t3b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
