<svg class="nerdit-anim" viewBox="0 0 480 360" role="img" aria-label="Making a virtual environment is the same command everywhere, but activating it differs: Windows uses one path, macOS and Linux another." font-family="Segoe UI, sans-serif">
  <g class="na-show" style="--d:0s">
    <rect x="30" y="40" width="200" height="140" rx="12" fill="var(--bg-soft)" stroke="var(--nb)" stroke-width="2"/>
    <text x="130" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="var(--nb)">Windows</text>
    <text x="130" y="134" text-anchor="middle" font-size="15" fill="var(--tx-m)">Scripts\activate</text>
  </g>
  <g class="na-show" style="--d:0.9s">
    <rect x="250" y="40" width="200" height="140" rx="12" fill="var(--bg-soft)" stroke="var(--orange)" stroke-width="2"/>
    <text x="350" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="var(--orange)">macOS / Linux</text>
    <text x="350" y="134" text-anchor="middle" font-size="15" fill="var(--tx-m)">bin/activate</text>
  </g>
  <g class="na-draw" style="--d:1.7s">
    <path d="M130 182 L130 230 L350 230 L350 182" stroke="var(--bd)" stroke-width="2" fill="none"/>
  </g>
  <g class="na-show" style="--d:2.2s">
    <rect x="130" y="230" width="220" height="80" rx="12" fill="var(--bg-soft)" stroke="var(--green)" stroke-width="2"/>
    <text x="240" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="var(--green)">venv is on</text>
  </g>
  <defs>
    <marker id="fgs01t1b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--nb)"/>
    </marker>
  </defs>
</svg>
